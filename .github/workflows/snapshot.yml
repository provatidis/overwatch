name: Daily snapshot

on:
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC every day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/snapshot.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # A change that breaks the job never gets to publish data or send alerts.
      - name: Tests
        run: npm test

      - name: Fetch data and send alerts
        run: node scripts/snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a free key from dev.blockscout.com for holder lists on every chain.
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}

      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data snapshot $(date -u +%F)"
            git pull --rebase --quiet
            git push
          fi
